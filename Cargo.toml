[package]
authors = ["eta <github@eta.st>"]
description = "A basic library to access gpsd that uses no C bindings."
documentation = "http://docs.rs/unbounded-gpsd"
license = "CC0-1.0"
name = "unbounded-gpsd"
readme = "README.md"
repository = "https://github.com/eeeeeta/unbounded-gpsd"
version = "0.6.0"
edition = "2024"

[dependencies]
thiserror = "2.0.18"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[dependencies.chrono]
features = ["serde"]
version = "0.4"
